name: ci

# 每次 push / PR 都跑：清单校验 + 单元测试。
# 发布前的"这堆代码还能不能用"就靠它，别等到发版才发现。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 清单基本校验
        run: node scripts/check-manifest.mjs plugin/sing

      # 测试清单只有一份：package.json 的 test 脚本（node --test test/*.test.mjs）。
      # 以前这里手写列文件，重构新增的 6 个测试（gpu-slot / managed-model / local-say /
      # say-speech / draw-proxy / gateway-gpu-slot）一个都没进 CI，GPU 互斥这种核心正确性
      # 只在本地验证过。以后加测试文件只改那一处。
      - name: 单元测试
        run: npm test
